name: Autopilot
on:
  schedule:
    - cron: "47 23 * * *"   # 5:17 AM India time (GitHub often starts late; odd minutes start sooner)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = make the video only (auto mode)"
        default: "false"
      force_kind:
        description: "optional: hukamnama, quote or montage"
        default: ""
concurrency: daily-post
permissions:
  contents: write
jobs:
  render-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USERNAME: ${{ secrets.TELEGRAM_ALLOWED_USERNAME }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      FORCE_KIND: ${{ github.event.inputs.force_kind }}
      POST_MODE: ${{ vars.POST_MODE || 'draft' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Chrome libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 || true
          sudo apt-get install -yq libasound2t64 || sudo apt-get install -yq libasound2 || true
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Sync inbox (Telegram)
        run: node scripts/ingest_telegram.mjs
      - name: Plan today's post
        run: node scripts/plan.mjs
      - name: Render reel
        if: env.SKIP != 'true'
        run: |
          COMP=$(node -p "JSON.parse(require('fs').readFileSync('out/plan.json','utf8')).composition")
          FILE=$(node -p "JSON.parse(require('fs').readFileSync('out/plan.json','utf8')).filename")
          mkdir -p videos
          npx remotion render src/index.ts "$COMP" "videos/$FILE" --props=out/props.json --codec=h264 --crf=16 --pixel-format=yuv420p
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          node scripts/finalize.mjs
      - name: Save to repository
        run: |
          git config user.name "sikhsoul-bot"
          git config user.email "actions@users.noreply.github.com"
          ls -t videos/*.mp4 2>/dev/null | tail -n +11 | xargs -r rm --
          git add -A videos content public
          git commit -m "Autopilot ${FILE:-rest day}" || echo "nothing new"
          git push
      - name: Wait for file to be reachable
        if: env.SKIP != 'true' && env.POST_MODE == 'auto'
        run: sleep 40
      - name: Send draft to Telegram (you post it yourself)
        if: env.SKIP != 'true' && env.POST_MODE == 'draft'
        run: node scripts/send_draft.mjs "videos/${FILE}"
      - name: Post to Instagram (only when POST_MODE = auto)
        if: env.SKIP != 'true' && env.POST_MODE == 'auto'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'false' }}
        run: |
          VIDEO_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/videos/${FILE}"
          VIDEO_URL="$VIDEO_URL" node scripts/post.mjs
          git pull -q --rebase && git add content && git commit -qm "Record media id" && git push -q || true
