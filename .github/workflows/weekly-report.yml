name: Weekly Report
on:
  schedule:
    - cron: "23 14 * * 0"   # Sunday evening India time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect views and send report
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/report.mjs
      - run: |
          git config user.name "report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content && git commit -m "Weekly views" || echo none
          git push
