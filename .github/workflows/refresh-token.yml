name: Refresh Instagram Token
on:
  schedule:
    - cron: "0 3 * * 1"   # weekly, Monday
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh and save
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          node scripts/refresh_token.mjs > /tmp/tok
          if [ -s /tmp/tok ] && [ -n "$GH_TOKEN" ]; then
            gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < /tmp/tok
            echo "✅ Token refreshed and saved automatically."
          else
            echo "::warning::Token refreshed but GH_PAT secret is missing, so it could not be saved automatically. See README section 7."
          fi
